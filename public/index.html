<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="appHeader">
      <h1>Ma To-Do List</h1>
      <button id="darkModeToggle" aria-label="Basculer le mode sombre" title="Mode sombre">☀️</button>
    </div>
    <input type="text" id="taskInput" placeholder="Nouvelle tâche">
    <button id="addTaskBtn">Ajouter</button>
    <div id="filterContainer" style="margin-top: 10px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
      <div>
        <button id="btnFilterAll" class="filter-btn active">Toutes</button>
        <button id="btnFilterActive" class="filter-btn">En cours</button>
        <button id="btnFilterCompleted" class="filter-btn">Terminées</button>
      </div>
      <select id="sortSelect" style="padding: 5px;">
        <option value="date-desc">Plus récent en premier</option>
        <option value="alpha">Ordre alphabétique</option>
        <option value="status">Par statut (En cours d'abord)</option>
      </select>
    </div>
    <ul id="taskList"></ul>
      <div id="loader" class="loader"></div>
        <div id="notification-container"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
